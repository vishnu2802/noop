name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Strand.xcodeproj \
            -scheme Strand \
            -configuration Release \
            -archivePath $PWD/build/Strand.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Strand.xcarchive/Products/Applications/*.app Payload/
          zip -r Strand.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strand-Unsigned-IPA
          path: Strand.ipa
